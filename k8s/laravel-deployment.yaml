apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-web
  labels:
    app.kubernetes.io/name: cloudpulse-web
    app.kubernetes.io/part-of: cloudpulse
spec:
  selector:
    app.kubernetes.io/name: cloudpulse-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-web
  labels:
    app.kubernetes.io/name: cloudpulse-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: cloudpulse
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudpulse-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudpulse-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: cloudpulse
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudpulse-web
      containers:
        
        - name: nginx
          image: ${IMAGE_WEB}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cloudpulse-config
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
        - name: php-fpm
          image: ${IMAGE_APP}
          imagePullPolicy: IfNotPresent
          ports:
            - name: fpm
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: cloudpulse-config
            - secretRef:
                name: cloudpulse-secrets
          securityContext:
            allowPrivilegeEscalation: false
          livenessProbe:
            tcpSocket:
              port: fpm
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            tcpSocket:
              port: fpm
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudpulse-web
  labels:
    app.kubernetes.io/name: cloudpulse-web
    app.kubernetes.io/part-of: cloudpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudpulse-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudpulse-web
  labels:
    app.kubernetes.io/name: cloudpulse-web
    app.kubernetes.io/part-of: cloudpulse
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudpulse-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-worker
  labels:
    app.kubernetes.io/name: cloudpulse-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: cloudpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudpulse-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudpulse-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: cloudpulse
    spec:
      
      terminationGracePeriodSeconds: 100
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 82 # www-data (alpine)
        runAsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ${IMAGE_APP}
          imagePullPolicy: IfNotPresent
         
          args:
            - php
            - artisan
            - queue:work
            - redis
            - --tries=3
            - --timeout=90
            - --max-time=3600
            - --sleep=3
          envFrom:
            - configMapRef:
                name: cloudpulse-config
            - secretRef:
                name: cloudpulse-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f "artisan queue:work" > /dev/null
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cloudpulse-migrate
  labels:
    app.kubernetes.io/name: cloudpulse-migrate
    app.kubernetes.io/component: migrate
    app.kubernetes.io/part-of: cloudpulse
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudpulse-migrate
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: cloudpulse
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ${IMAGE_APP}
          imagePullPolicy: IfNotPresent
          args:
            - sh
            - -c
            - php artisan migrate --force && php artisan cloudpulse:storage-init
          envFrom:
            - configMapRef:
                name: cloudpulse-config
            - secretRef:
                name: cloudpulse-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
