        app.kubernetes.io/part-of: cloudpulse
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - --server-id=2
            - --log-bin=mysql-bin
            - --relay-log=relay-bin
            
            - --replica-skip-errors=1396
            - --gtid-mode=ON
            - --enforce-gtid-consistency=ON
            - --read-only=ON
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudpulse-secrets
                  key: DB_ROOT_PASSWORD
            
            - name: APP_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: cloudpulse-config
                  key: DB_DATABASE
            - name: APP_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: cloudpulse-config
                  key: DB_USERNAME
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudpulse-secrets
                  key: DB_PASSWORD
            - name: MYSQL_SOURCE_HOST
              valueFrom:
                configMapKeyRef:
                  name: cloudpulse-config
                  key: DB_HOST
            - name: MYSQL_REPLICATION_USER
              valueFrom:
                configMapKeyRef:
                  name: cloudpulse-config
                  key: DB_REPLICATION_USER
            - name: MYSQL_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudpulse-secrets
                  key: DB_REPLICATION_PASSWORD
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h127.0.0.1 -uroot --silent
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h127.0.0.1 -uroot --silent
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h127.0.0.1 -uroot --silent
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init-scripts
          configMap:
            name: mysql-init-scripts
            defaultMode: 365
            items:
              - key: replica-10-setup-replication.sh
                path: 10-setup-replication.sh
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
