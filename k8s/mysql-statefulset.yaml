apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-scripts
  labels:
    app.kubernetes.io/part-of: cloudpulse
data:
  primary-10-replication-user.sh: |
    #!/bin/bash
    # Runs only on PRIMARY during the initial startup (official image's initdb mechanism).
      set -euo pipefail

    echo "[init] creating replication user '${MYSQL_REPLICATION_USER}'"
    MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysql --protocol=socket -uroot -hlocalhost \
      --socket=/var/run/mysqld/mysqld.sock <<SQL
    SET sql_log_bin = 0;
    CREATE USER IF NOT EXISTS '${MYSQL_REPLICATION_USER}'@'%' IDENTIFIED BY '${MYSQL_REPLICATION_PASSWORD}';
    GRANT REPLICATION SLAVE ON *.* TO '${MYSQL_REPLICATION_USER}'@'%';
    SQL

  replica-10-setup-replication.sh: |
    #!/bin/bash
    # Runs only on REPLICA during the initial startup.
    set -euo pipefail

    echo "[init] creating read-only app user and configuring replication from '${MYSQL_SOURCE_HOST}'"
    MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysql --protocol=socket -uroot -hlocalhost \
      --socket=/var/run/mysqld/mysqld.sock <<SQL
    SET sql_log_bin = 0;
    CREATE DATABASE IF NOT EXISTS ${APP_DATABASE};
    CREATE USER IF NOT EXISTS '${APP_DB_USER}'@'%' IDENTIFIED BY '${APP_DB_PASSWORD}';
    GRANT SELECT ON ${APP_DATABASE}.* TO '${APP_DB_USER}'@'%';

    CHANGE REPLICATION SOURCE TO
      SOURCE_HOST = '${MYSQL_SOURCE_HOST}',
      SOURCE_PORT = 3306,
      SOURCE_USER = '${MYSQL_REPLICATION_USER}',
      SOURCE_PASSWORD = '${MYSQL_REPLICATION_PASSWORD}',
      SOURCE_AUTO_POSITION = 1,
      SOURCE_CONNECT_RETRY = 10,
      SOURCE_RETRY_COUNT = 86400,
      GET_SOURCE_PUBLIC_KEY = 1;
    START REPLICA;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-primary
  labels:
    app.kubernetes.io/name: mysql-primary
    app.kubernetes.io/part-of: cloudpulse
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql-primary
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-replica
  labels:
    app.kubernetes.io/name: mysql-replica
    app.kubernetes.io/part-of: cloudpulse
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql-replica
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-primary
  labels:
    app.kubernetes.io/name: mysql-primary
    app.kubernetes.io/part-of: cloudpulse
spec:
  serviceName: mysql-primary
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-primary
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: cloudpulse
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - --server-id=1
            - --log-bin=mysql-bin
            - --binlog-format=ROW
            - --binlog-expire-logs-seconds=604800
            - --gtid-mode=ON
            - --enforce-gtid-consistency=ON
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudpulse-secrets
                  key: DB_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: cloudpulse-config
                  key: DB_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: cloudpulse-config
                  key: DB_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudpulse-secrets
                  key: DB_PASSWORD
            - name: MYSQL_REPLICATION_USER
              valueFrom:
                configMapKeyRef:
                  name: cloudpulse-config
                  key: DB_REPLICATION_USER
            - name: MYSQL_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudpulse-secrets
                  key: DB_REPLICATION_PASSWORD
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h127.0.0.1 -uroot --silent
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h127.0.0.1 -uroot --silent
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h127.0.0.1 -uroot --silent
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              
              subPath: mysql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init-scripts
          configMap:
            name: mysql-init-scripts
            defaultMode: 365 
            items:
              - key: primary-10-replication-user.sh
                path: 10-replication-user.sh
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-replica
  labels:
    app.kubernetes.io/name: mysql-replica
    app.kubernetes.io/part-of: cloudpulse
spec:
  serviceName: mysql-replica
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-replica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-replica
