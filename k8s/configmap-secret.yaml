apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudpulse-config
  labels:
    app.kubernetes.io/part-of: cloudpulse
data:
  # ── Laravel ──
  APP_NAME: "CloudPulse"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "${APP_URL}"
  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"
  APP_MAINTENANCE_DRIVER: "file"
  BCRYPT_ROUNDS: "12"
  TRUSTED_PROXIES: "*"
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "info"

  # ── MySQL: writing -> primary, reading -> replica (headless Service names) ──
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql-primary"
  DB_READ_HOST: "mysql-replica"
  DB_PORT: "3306"
  DB_DATABASE: "cloudpulse"
  DB_USERNAME: "cloudpulse"
  DB_TIMEOUT: "3"
  DB_REPLICATION_USER: "replicator"

  # ── Redis: sessions, cache, queues ──
  REDIS_CLIENT: "predis"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  SESSION_DRIVER: "redis"
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  CACHE_STORE: "redis"
  QUEUE_CONNECTION: "redis"

  # ── Object storage (S3 compatible, in-cluster) ──
  FILESYSTEM_DISK: "s3"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_BUCKET: "cloudpulse-uploads"
  AWS_ENDPOINT: "http://minio:9000"
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

  # ── CloudPulse Application Settings ──
  CLOUDPULSE_DISK: "s3"
  CLOUDPULSE_MAX_UPLOAD_KB: "10240"
  CLOUDPULSE_ALLOWED_EXTENSIONS: "jpg,jpeg,png,pdf,txt,csv,zip"
  CLOUDPULSE_UPLOADS_PER_MINUTE: "20"
  CLOUDPULSE_STATUS_POLL_SECONDS: "10"

  # ── Nginx / PHP-FPM (templates under docker/ read these) ──
  # Upload limit chain: Nginx 16m >= PHP post_max_size 16M >= PHP
  # upload_max_filesize 12M >= application 10240 KB.
  PHP_FPM_ADDRESS: "127.0.0.1:9000"
  NGINX_CLIENT_MAX_BODY_SIZE: "16m"
  PHP_UPLOAD_MAX_FILESIZE: "12M"
  PHP_POST_MAX_SIZE: "16M"
  PHP_FPM_MAX_CHILDREN: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudpulse-secrets
  labels:
    app.kubernetes.io/part-of: cloudpulse
type: Opaque
stringData:
  APP_KEY: "${APP_KEY}"
  DB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
  DB_PASSWORD: "${DB_PASSWORD}"
  DB_REPLICATION_PASSWORD: "${DB_REPLICATION_PASSWORD}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
  MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
  # The application connects to object storage using the MinIO root credentials (for simplicity).
  AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
  AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
